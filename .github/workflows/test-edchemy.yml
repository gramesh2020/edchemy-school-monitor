name: Test Edchemy API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Test Edchemy API authentication
        env:
          EDCHEMY_AUTH: ${{ secrets.EDCHEMY_AUTH }}
        run: |
          python - <<'PY'
          import os
          import requests

          authorization = os.environ["EDCHEMY_AUTH"]

          url = "https://edchemy.azaleakids.in/api/v2/external/call"

          headers = {
              "authorization": authorization,
              "content-type": "application/json",
          }

          response = requests.post(
              url,
              headers=headers,
              json={},
              timeout=30,
          )

          print("Edchemy API HTTP status:", response.status_code)
          print("Response received:", response.text[:500])
          PY
