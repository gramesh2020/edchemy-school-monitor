name: Test Edchemy Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Python environment
        run: |
          python --version
          python -c "import requests; print('requests available:', requests.__version__)"

      - name: Test Edchemy connectivity
        run: |
          python - <<'PY'
          import requests

          url = "https://edchemy.azaleakids.in"

          response = requests.get(url, timeout=30)

          print("Edchemy HTTP status:", response.status_code)
          print("Edchemy reachable: YES")
          PY
