name: Edchemy Daily Report Monitor

on:
  schedule:
    # 3:05 PM India time
    - cron: "5 15 * * *"
      timezone: "Asia/Kolkata"

  # Allows us to run the monitor manually for testing.
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ------------------------------------------------------
      # 1. Check out the repository
      # ------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. Set up Python
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------
      # 3. Install Python dependency
      # ------------------------------------------------------
      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      # ------------------------------------------------------
      # 4. Run Edchemy monitor
      # ------------------------------------------------------
      - name: Run Edchemy monitor
        env:
          EDCHEMY_AUTH: ${{ secrets.EDCHEMY_AUTH }}
          EDCHEMY_STUDENT_GUID: ${{ secrets.EDCHEMY_STUDENT_GUID }}
          EDCHEMY_USER_ID: ${{ secrets.EDCHEMY_USER_ID }}
          EDCHEMY_ACADEMIC_YEAR_ID: ${{ secrets.EDCHEMY_ACADEMIC_YEAR_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python github_monitor.py

      # ------------------------------------------------------
      # 5. Save monitor state
      # ------------------------------------------------------
      - name: Save monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f monitor_state.db ]; then
            echo "Monitor state database found."

            git add monitor_state.db

            if ! git diff --cached --quiet; then
              echo "Monitor state changed. Committing..."

              git commit -m "Update Edchemy monitor state"
              git push

              echo "Monitor state saved successfully."
            else
              echo "No monitor state changes to save."
            fi

          else
            echo "No monitor state database was created in this run."
          fi
