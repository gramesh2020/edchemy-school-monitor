name: Edchemy Daily Report Monitor

on:
  schedule:
    # 3:00 PM IST = 9:30 AM UTC
    - cron: "30 9 * * *"

  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run Edchemy monitor
        env:
          EDCHEMY_AUTH: ${{ secrets.EDCHEMY_AUTH }}
          EDCHEMY_STUDENT_GUID: ${{ secrets.EDCHEMY_STUDENT_GUID }}
          EDCHEMY_USER_ID: ${{ secrets.EDCHEMY_USER_ID }}
          EDCHEMY_ACADEMIC_YEAR_ID: ${{ secrets.EDCHEMY_ACADEMIC_YEAR_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python github_monitor.py

      - name: Save monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add monitor_state.db

          git diff --cached --quiet || \
            git commit -m "Update Edchemy monitor state"

          git push
